[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftcheck"
version = "0.4.0"
description = "Characterize distribution shift: marginal, transformation-compatibility and dependence diagnostics with uncertainty."
readme = "README.md"
license = "MIT"
keywords = ["distribution shift", "drift", "copula", "equivalence testing", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/eaheog-DecisionScience/shiftcheck"
Repository = "https://github.com/eaheog-DecisionScience/shiftcheck"

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
sklearn = ["scikit-learn>=1.2"]
dev = ["pytest", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
